version: "3.8"
name: "kitchen-ai"

# Optional local Postgres. Realtime only works against a Neon branch, so
# `pnpm dev` uses the DATABASE_URL from .env.local instead.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kitchen_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "54321:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    tmpfs:
      - /tmp
    command:
      - -c
      - listen_addresses=*
      - -c
      - wal_level=logical

volumes:
  postgres_data:
